name: coleta-noturna

on:
  schedule:
    # 03:07 em Brasília (UTC-3, sem horário de verão) = 06:07 UTC.
    # Minuto quebrado de propósito: crons no minuto 0 atrasam mais no GitHub.
    - cron: "7 6 * * *"
  workflow_dispatch:
    inputs:
      limite:
        description: "Máximo de consultas SERP (vazio = todas). Use 4 pro primeiro teste."
        required: false
        default: ""

concurrency:
  group: coleta-noturna
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
      DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
      USEO_COST_ALERT_USD: ${{ vars.USEO_COST_ALERT_USD || '5' }}
    defaults:
      run:
        working-directory: collectors
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/pyproject.toml

      - run: pip install -e .

      - name: M1 · heartbeat
        run: python -m useo heartbeat

      - name: M1 · sincroniza config/ com o banco
        run: python -m useo sync

      - name: M2 · rank tracking
        env:
          LIMITE: ${{ inputs.limite }}
        run: python -m useo rank ${LIMITE:+--limite "$LIMITE"}

      - name: Alerta de custo diário
        if: always()
        run: python -m useo check-cost
